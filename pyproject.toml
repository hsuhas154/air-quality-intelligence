[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-quality-intelligence"
version = "0.1.0"
description = "End-to-end urban air quality analytics and forecasting platform for Indian cities."
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "tenacity>=9,<10",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
  "plotly>=5.24,<7",
  "streamlit>=1.39,<2",
  "pydeck>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
