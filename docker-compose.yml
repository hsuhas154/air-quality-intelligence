services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: air_quality
      POSTGRES_USER: aqi
      POSTGRES_PASSWORD: aqi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqi -d air_quality"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://aqi:aqi@db:5432/air_quality
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
